[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Extract structured JSON from invoice images using Google Gemini, with validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.47,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
invoice-extract = "invoice_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
